name: Deploy demo a demo.egida.uk

# CI/CD igual que el sitio principal: push a main -> GitHub Actions publica el estático
# en la instancia OCI a través de un túnel SSH de Cloudflare Access (sin exponer el puerto 22).
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '.github/**'
  workflow_dispatch: {}

concurrency:
  group: deploy-demo
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Instalar cloudflared
        run: |
          sudo curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Configurar SSH vía Cloudflare Access
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEMO_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          {
            echo "Host demo-vps"
            echo "  HostName ssh-demo.egida.uk"
            echo "  User ${{ secrets.DEMO_USER }}"
            echo "  IdentityFile ~/.ssh/id_deploy"
            echo "  StrictHostKeyChecking no"
            echo "  ProxyCommand cloudflared access ssh --hostname %h --service-token-id ${{ secrets.CF_ACCESS_CLIENT_ID }} --service-token-secret ${{ secrets.CF_ACCESS_CLIENT_SECRET }}"
          } >> ~/.ssh/config

      - name: Publicar archivos estáticos (rsync)
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude '.github' --exclude 'deploy' --exclude 'README.md' --exclude '.nojekyll' \
            ./ demo-vps:/var/www/demo.egida.uk/

      - name: Recargar nginx
        run: ssh demo-vps 'sudo systemctl reload nginx'

      - name: Smoke test (sitio en vivo)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://demo.egida.uk)
          echo "HTTP $code"
          [ "$code" = "200" ] || { echo "❌ demo.egida.uk no respondió 200"; exit 1; }
          echo "✅ demo.egida.uk desplegada"
